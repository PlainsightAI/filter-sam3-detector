services:
  video_in:
    image: containers.openfilter.io/plainsightai/openfilter-video-in:v0.1.10
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-}
      FILTER_ID: VideoIn
      FILTER_SOURCES: file:///video.mp4!sync!loop
      FILTER_OUTPUTS: tcp://*
    volumes:
      - ./data/sample.mp4:/video.mp4:ro

  sam3_detector:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: filter-sam3-detector:local
    pull_policy: never
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-}
      FILTER_ID: SAM3Detector
      FILTER_SOURCES: tcp://video_in
      FILTER_OUTPUTS: tcp://*
      FILTER_MQ_LOG: pretty
      # Detection configuration
      FILTER_TEXT_PROMPT: ${TEXT_PROMPT:-}
      FILTER_EXEMPLARS_PATH: ${EXEMPLARS_PATH:-}
      FILTER_CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.5}
      FILTER_DEVICE: ${DEVICE:-cuda}
      FILTER_VISUALIZE: ${VISUALIZE:-false}
    volumes:
      # Mount exemplar images if provided
      - ${EXEMPLARS_PATH:-./data/exemplars}:/exemplars:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  webvis:
    image: containers.openfilter.io/plainsightai/openfilter-webvis:v0.1.10
    environment:
      FILTER_ID: Webvis
      FILTER_SOURCES: tcp://sam3_detector
    ports:
      - 8001:8000

# Ensure RELEASE.md and VERSION file are updated in PRs — but only when
# filter code / runtime-affecting files change. Pure CI or docs-only PRs
# skip the release-log check (mirrors PlainsightAI/protege-ml pr.yaml).
name: Version Check

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      filter: ${{ steps.filter.outputs.filter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            filter:
              - 'filter_sam3_detector/**'
              - 'sam3/**'
              - 'tests/**'
              - 'scripts/**'
              - 'Dockerfile'
              - 'Dockerfile.dev'
              - 'docker-compose*.yaml'
              - 'cloudbuild.yaml'
              - 'pyproject.toml'
              - 'VERSION'
              - 'RELEASE.md'

  check-release-log:
    name: Check Release Log
    needs: changes
    if: needs.changes.outputs.filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check RELEASE.md
        uses: PlainsightAI/gh-actions/check-release-log@main

name: Create Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: PlainsightAI/gh-actions-public/.github/workflows/filter-release.yaml@main
    permissions:
      contents: write
      pull-requests: read
    with:
      docker_image: plainsightai/openfilter-sam3-detector
      python_versions: '["3.11", "3.12"]'
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

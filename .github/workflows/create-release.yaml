name: Create Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: PlainsightAI/gh-actions/.github/workflows/filter-release-premium.yaml@main
    permissions:
      contents: write
      id-token: write
      actions: read
      pull-requests: read
    with:
      python_versions: '["3.11", "3.12"]'
      source-paths: |
        filter_*/**
        pyproject.toml
        Dockerfile*
        requirements*.txt
        Makefile
      # SAM3-scoped; repo-level only. Upstream is projects/plainsightai-dev/
      # secrets/sam3-hf-token — do not elevate to org-level.
      forward_secrets_as_env: HF_TOKEN
    secrets: inherit

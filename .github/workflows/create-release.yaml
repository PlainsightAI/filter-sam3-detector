name: Create Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: PlainsightAI/gh-actions/.github/workflows/filter-release-premium.yaml@main
    permissions:
      contents: write
      id-token: write
      actions: read
      pull-requests: read
    with:
      python_versions: '["3.11", "3.12"]'
      source-paths: |
        filter_*/**
        pyproject.toml
        Dockerfile*
        requirements*.txt
        Makefile
    # `inherit` passes all repo-level secrets (including HF_TOKEN, used by
    # publish-gar-premium to mount --secret=hf_token into the Docker build)
    # into the reusable workflow. Cheaper than listing each secret and
    # avoids breakage when the reusable workflow adds new optional secrets.
    secrets: inherit

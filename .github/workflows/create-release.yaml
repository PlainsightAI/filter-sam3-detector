name: Create Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    # Pinned to the platforms-input branch during live-test on
    # PlainsightAI/gh-actions-public#14. Will re-pin to @main once that PR
    # merges and the inputs are stable.
    uses: PlainsightAI/gh-actions-public/.github/workflows/filter-release.yaml@feat/filter-release-public-platforms-input
    with:
      docker_image: plainsightai/openfilter-sam3-detector
      python_versions: '["3.11", "3.12"]'
      source-paths: |
        filter_*/**
        pyproject.toml
        Dockerfile*
        requirements*.txt
        Makefile
      # pytorch/pytorch:*-cuda* is amd64-only across every CUDA tag, so
      # building for arm64 would fail at the base-image pull.
      platforms: linux/amd64
      # SAM3-scoped; repo-level only. Upstream is projects/plainsightai-dev/
      # secrets/sam3-hf-token — do not elevate to org-level. Forwarded into
      # the publish-docker job's env via the env-forwarding step, then mounted
      # as a BuildKit secret (id=hf_token) in docker/build-push-action so the
      # gated SAM3 weights can be pulled at build time.
      forward_secrets_as_env: HF_TOKEN
      build_secrets: |
        id=hf_token,env=HF_TOKEN
    # Explicit secret mapping (the standard pattern across every public
    # filter) — the workflow's required PYPI_API_TOKEN / DOCKERHUB_TOKEN
    # are remapped from the org-level PLAINSIGHT_PYPI_TOKEN /
    # DOCKERHUB_ACCESS_TOKEN. HF_TOKEN is now an optional declared
    # secret on the public workflow (added in PR #14), so it composes
    # with the explicit-mapping pattern instead of forcing `inherit`.
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PLAINSIGHT_PYPI_TOKEN }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

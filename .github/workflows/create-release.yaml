name: Create Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: PlainsightAI/gh-actions-public/.github/workflows/filter-release.yaml@main
    with:
      docker_image: docker.io/plainsightai/openfilter-sam3-detector
      schema_module: filter_sam3_detector.filter
      schema_class: FilterSAM3DetectorConfigSchema
      python_versions: '["3.11", "3.12"]'
      source-paths: |
        filter_*/**
        pyproject.toml
        Dockerfile*
        requirements*.txt
        Makefile
      # pytorch/pytorch:*-cuda* is amd64-only across every CUDA tag, so
      # building for arm64 would fail at the base-image pull.
      platforms: linux/amd64
      # HF_TOKEN (repo-level secret) forwarded into the publish-docker
      # job's env, then mounted as a BuildKit secret so the gated SAM3
      # weights can be pulled at build time.
      forward_secrets_as_env: HF_TOKEN
      build_secrets: |
        hf_token=HF_TOKEN
    secrets: inherit

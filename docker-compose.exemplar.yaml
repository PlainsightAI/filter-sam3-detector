# Exemplar pipeline = reference boxes only (no FILTER_EXEMPLARS_PATH). VideoIn -> SAM3Detector -> Webvis.
# Uses FILTER_POSITIVE_BOXES and FILTER_NEGATIVE_BOXES (JSON arrays of [x,y,w,h] in pixels).
# .env: VIDEO_PATH, FILTER_POSITIVE_BOXES and/or FILTER_NEGATIVE_BOXES (JSON), FILTER_TEXT_PROMPT (optional), FILTER_DEVICE, FILTER_CONFIDENCE_THRESHOLD, FILTER_OUTPUT_DIR.

services:
  video_in:
    image: containers.openfilter.io/plainsightai/openfilter-video-in:v0.1.10
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: VideoIn
      FILTER_SOURCES: file:///video.mp4!no-loop!sync
      FILTER_OUTPUTS: tcp://*:5550
    volumes:
      - ${VIDEO_PATH:-./data/sample-video.mp4}:/video.mp4:ro
    networks:
      - filter-network

  sam3_detector:
    image: plainsightai/openfilter-sam3-detector:${SAM3_DETECTOR_VERSION:-latest}
    platform: linux/amd64
    env_file: .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: filter_sam3_detector
      FILTER_SOURCES: tcp://video_in:5550
      FILTER_OUTPUTS: tcp://*:5552
      FILTER_TEXT_PROMPT: ${FILTER_TEXT_PROMPT:-}
      FILTER_POSITIVE_BOXES: ${FILTER_POSITIVE_BOXES:-}
      FILTER_NEGATIVE_BOXES: ${FILTER_NEGATIVE_BOXES:-}
      FILTER_DEVICE: ${FILTER_DEVICE:-cuda}
      FILTER_CONFIDENCE_THRESHOLD: ${FILTER_CONFIDENCE_THRESHOLD:-0.5}
      FILTER_OUTPUT_LABEL: detections
      # FILTER_VIZ_TOPIC: "viz"  # optional: separate topic for visualized frames; main stays original+meta
      FILTER_OUTPUT_PATH: /output/detections.jsonl
      FILTER_FRAMES_OUTPUT_DIR: /output/frames
      FILTER_ENABLE_TEMPORAL_INTERVALS: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ${FILTER_OUTPUT_DIR:-./results}:/output
    networks:
      - filter-network

  webvis:
    image: containers.openfilter.io/plainsightai/openfilter-webvis:v0.1.10
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: Webvis
      FILTER_SOURCES: tcp://sam3_detector:5552
    ports:
      - "8002:8000"
    networks:
      - filter-network

networks:
  filter-network:

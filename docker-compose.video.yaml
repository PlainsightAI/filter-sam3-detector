services:
  video_in:
    image: containers.openfilter.io/plainsightai/openfilter-video-in:v0.1.10
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: VideoIn
      FILTER_SOURCES: file:///video.mp4!sync
      FILTER_OUTPUTS: tcp://*:5550
    volumes:
      - ${VIDEO_PATH:-./data/input.mp4}:/video.mp4:ro
    networks:
      - filter-network

  sam3_detector:
    # Override SAM3_IMAGE for a custom build; default pulls the public release.
    build: 
      context: ./
      dockerfile: Dockerfile.dev
    image: filter-sam3-detector:local
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      FILTER_ID: SAM3Detector
      FILTER_SOURCES: tcp://video_in:5550
      FILTER_OUTPUTS: tcp://*:5551

      # single prompt
      FILTER_TEXT_PROMPT: ${FILTER_TEXT_PROMPT}
      # FILTER_ENABLE_VIDEO_MODE: true
      # FILTER_PRUNE_VIDEO_MEMORY: true

      # multi prompt
      # FILTER_TEXT_PROMPTS: ${FILTER_TEXT_PROMPTS}

      # Exemplar-based detection config
      FILTER_CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.5}
      FILTER_NMS_THRESHOLD: ${NMS_THRESHOLD:-0.1}
      FILTER_OUTPUT_LABEL: ${OUTPUT_LABEL:-exemplar_detections}
      FILTER_OUTPUT_BOXES: "true"
      FILTER_OUTPUT_SCORES: "true"
      # Optional: save detections to JSONL
      FILTER_OUTPUT_PATH: ${OUTPUT_PATH:-/output/detections.jsonl}
      # FILTER_annotated_frames_output_dir
      FILTER_ANNOTATED_FRAMES_OUTPUT_DIR: ${ANNOTATED_FRAMES_OUTPUT_DIR:-/output/annotated_frames}
      FILTER_SAVE_ANNOTATED_FRAMES: "true"
      FILTER_FRAMES_OUTPUT_DIR: ${FRAMES_OUTPUT_DIR:-/output/frames}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ${EXEMPLARS_DIR:-./exemplars}:/exemplars:ro
      - ${OUTPUT_DIR:-./output}:/output
      - ${DATA_DIR:-./data}:/data:ro
    networks:
      - filter-network

  webvis:
    image: containers.openfilter.io/plainsightai/openfilter-webvis:v0.1.10
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: Webvis
      FILTER_SOURCES: tcp://sam3_detector:5551
    ports:
      - "${WEBVIS_PORT:-8000}:8000"
    networks:
      - filter-network

networks:
  filter-network:

secrets:
  hf_token:
    environment: HF_TOKEN
# Docker build for filter-sam3-detector
# Triggers: tag v*, tag *-dev
#
# - Version tags (v*): Push to GAR with version tag + semver-gated :latest
# - Dev tags (v*-dev): Push to GAR with dev tag + short SHA
#
# Secrets required in GCP Secret Manager:
#   - sam3-hf-token (HuggingFace token for gated model access)

substitutions:
  _GAR_REPO: us-west1-docker.pkg.dev/plainsightai-prod/oci/filter-sam3-detector

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/sam3-hf-token/versions/latest
      env: 'HF_TOKEN'

steps:
  # Step 1: Configure GAR auth (saves token to /workspace for docker step)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        echo "Configuring GAR auth for tag: ${TAG_NAME}"
        gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
        ACCESS_TOKEN=$$(gcloud auth print-access-token)
        echo "$$ACCESS_TOKEN" > /workspace/.gar_token
        echo "GAR token saved to /workspace/.gar_token"

  # Step 2: Docker build and push
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv: ['HF_TOKEN']
    args:
      - '-c'
      - |
        set -e

        # Read version from VERSION file (strip v prefix if present)
        VERSION=$$(cat VERSION | tr -d '[:space:]' | sed 's/^v//')
        echo "Building version: $$VERSION"

        # Configure GAR auth
        if [[ -f /workspace/.gar_token ]]; then
          GAR_TOKEN=$$(cat /workspace/.gar_token)
          AUTH_B64=$$(echo -n "oauth2accesstoken:$$GAR_TOKEN" | base64 -w0)
          mkdir -p /builder/home/.docker
          printf '{\n  "auths": {\n    "us-west1-docker.pkg.dev": {\n      "auth": "%s"\n    }\n  }\n}\n' "$$AUTH_B64" > /builder/home/.docker/config.json
          echo "GAR auth configured for us-west1-docker.pkg.dev"
        else
          echo "ERROR: /workspace/.gar_token not found"
          exit 1
        fi

        # Build with HF_TOKEN secret for model download
        echo "$$HF_TOKEN" > /tmp/hf_token
        DOCKER_BUILDKIT=1 docker build \
          --secret id=hf_token,src=/tmp/hf_token \
          -t build:${SHORT_SHA} \
          .
        rm /tmp/hf_token

        # Helper function to compare semver (returns 0 if $1 >= $2)
        version_gte() {
          [ "$$(printf '%s\n' "$$1" "$$2" | sort -V | tail -n1)" = "$$1" ]
        }

        # Tag and push based on trigger type
        if [[ "${TAG_NAME}" =~ ^v[0-9] ]] && [[ ! "${TAG_NAME}" =~ -dev$$ ]]; then
          # Version tag (v*): push to GAR with version + semver-gated :latest
          echo "Version tag build: ${TAG_NAME} -> GAR"

          docker tag build:${SHORT_SHA} ${_GAR_REPO}:$$VERSION
          docker push ${_GAR_REPO}:$$VERSION

          # Only update 'latest' if this version >= current latest
          # List existing tags and find the highest semver
          CURRENT_VERSION="0.0.0"
          EXISTING_LATEST=$$(gcloud artifacts tags list \
            --package=filter-sam3-detector \
            --repository=oci \
            --location=us-west1 \
            --filter="tag=latest" \
            --format="value(version)" 2>/dev/null || echo "")

          if [[ -n "$$EXISTING_LATEST" ]]; then
            # Get the version tag that shares the same image as :latest
            CURRENT_VERSION=$$(gcloud artifacts tags list \
              --package=filter-sam3-detector \
              --repository=oci \
              --location=us-west1 \
              --filter="version=$$EXISTING_LATEST" \
              --format="value(tag)" 2>/dev/null | \
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$$' | head -1 || echo "0.0.0")
            CURRENT_VERSION="$${CURRENT_VERSION:-0.0.0}"
          fi

          echo "Current version: $$VERSION, Latest published: $$CURRENT_VERSION"
          if version_gte "$$VERSION" "$$CURRENT_VERSION"; then
            echo "Version $$VERSION >= $$CURRENT_VERSION, updating 'latest' tag"
            docker tag build:${SHORT_SHA} ${_GAR_REPO}:latest
            docker push ${_GAR_REPO}:latest
          else
            echo "Version $$VERSION < $$CURRENT_VERSION, skipping 'latest' tag update"
          fi

        elif [[ "${TAG_NAME}" =~ -dev$$ ]]; then
          # Dev tag (*-dev): push to GAR
          echo "Dev tag build: ${TAG_NAME} -> GAR"
          DEV_VERSION=$$(echo "${TAG_NAME}" | sed 's/^v//')
          echo "Pushing to GAR with tags: $$DEV_VERSION and ${SHORT_SHA}"

          docker tag build:${SHORT_SHA} ${_GAR_REPO}:$$DEV_VERSION
          docker tag build:${SHORT_SHA} ${_GAR_REPO}:${SHORT_SHA}
          docker push ${_GAR_REPO}:$$DEV_VERSION
          docker push ${_GAR_REPO}:${SHORT_SHA}

        else
          echo "Unknown tag pattern: ${TAG_NAME} - skipping push"
        fi

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 50
  logging: CLOUD_LOGGING_ONLY

timeout: '3600s'

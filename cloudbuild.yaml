# Docker build for filter-sam3-detector
# Triggers: tag v*, tag *-dev
#
# - Version tags (v*): Push to Docker Hub as release images
# - Dev tags (*-dev): Push to GAR for development/testing
#
# Secrets required in GCP Secret Manager:
#   - dockerhub-username
#   - dockerhub-token
#   - sam3-hf-token (HuggingFace token for gated model access)

substitutions:
  _DOCKERHUB_REPO: plainsightai/openfilter-sam3-detector
  _GAR_REPO: us-west1-docker.pkg.dev/plainsightai-dev/sam3-builds/filter-sam3-detector

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/dockerhub-username/versions/latest
      env: 'DOCKERHUB_USERNAME'
    - versionName: projects/${PROJECT_ID}/secrets/dockerhub-token/versions/latest
      env: 'DOCKERHUB_TOKEN'
    - versionName: projects/${PROJECT_ID}/secrets/sam3-hf-token/versions/latest
      env: 'HF_TOKEN'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv: ['DOCKERHUB_USERNAME', 'DOCKERHUB_TOKEN', 'HF_TOKEN']
    args:
      - '-c'
      - |
        set -e

        # Read version from VERSION file
        VERSION=$(cat VERSION | tr -d '[:space:]')

        # Build with HF_TOKEN secret for model download
        echo "$$HF_TOKEN" > /tmp/hf_token
        DOCKER_BUILDKIT=1 docker build \
          --secret id=hf_token,src=/tmp/hf_token \
          -t build:${SHORT_SHA} \
          .
        rm /tmp/hf_token

        # Tag and push based on trigger type
        if [[ "${TAG_NAME}" =~ ^v ]]; then
          # Version tag: push to Docker Hub
          echo "Version tag build: ${TAG_NAME} -> Docker Hub"
          echo "$$DOCKERHUB_TOKEN" | docker login -u "$$DOCKERHUB_USERNAME" --password-stdin

          docker tag build:${SHORT_SHA} ${_DOCKERHUB_REPO}:$${VERSION}
          docker tag build:${SHORT_SHA} ${_DOCKERHUB_REPO}:latest
          docker push ${_DOCKERHUB_REPO}:$${VERSION}
          docker push ${_DOCKERHUB_REPO}:latest
        elif [[ "${TAG_NAME}" =~ -dev$ ]]; then
          # Dev tag (*-dev): push to GAR
          echo "Dev tag build: ${TAG_NAME} -> GAR"
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

          docker tag build:${SHORT_SHA} ${_GAR_REPO}:${TAG_NAME}
          docker tag build:${SHORT_SHA} ${_GAR_REPO}:${SHORT_SHA}
          docker push ${_GAR_REPO}:${TAG_NAME}
          docker push ${_GAR_REPO}:${SHORT_SHA}
        else
          echo "Unknown tag pattern: ${TAG_NAME} - skipping push"
        fi

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 50
  logging: CLOUD_LOGGING_ONLY

timeout: '3600s'

# Docker build for filter-sam3-detector
# Triggers: tag v*, tag *-dev
#
# - Version tags (v*): Push to Docker Hub as release images
# - Dev tags (v*-dev): Push to GAR (prod) for development/testing
#
# Secrets required in GCP Secret Manager:
#   - dockerhub-username
#   - dockerhub-token
#   - sam3-hf-token (HuggingFace token for gated model access)

substitutions:
  _DOCKERHUB_REPO: plainsightai/openfilter-sam3-detector
  _GAR_REPO: us-west1-docker.pkg.dev/plainsightai-prod/oci/filter-sam3-detector

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/dockerhub-username/versions/latest
      env: 'DOCKERHUB_USERNAME'
    - versionName: projects/${PROJECT_ID}/secrets/dockerhub-token/versions/latest
      env: 'DOCKERHUB_TOKEN'
    - versionName: projects/${PROJECT_ID}/secrets/sam3-hf-token/versions/latest
      env: 'HF_TOKEN'

steps:
  # Step 1: Configure GAR auth for dev builds (saves token to /workspace for docker step)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        # Configure GAR auth for dev builds
        if [[ "${TAG_NAME}" =~ -dev$$ ]]; then
          echo "Dev tag detected: ${TAG_NAME} - configuring GAR auth"
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
          ACCESS_TOKEN=$$(gcloud auth print-access-token)
          echo "$$ACCESS_TOKEN" > /workspace/.gar_token
          echo "GAR token saved to /workspace/.gar_token"
        else
          echo "Not a dev build (TAG_NAME=${TAG_NAME}), skipping GAR auth setup"
        fi

  # Step 2: Docker build and push
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv: ['DOCKERHUB_USERNAME', 'DOCKERHUB_TOKEN', 'HF_TOKEN']
    args:
      - '-c'
      - |
        set -e

        # Read version from VERSION file (strip v prefix if present)
        VERSION=$$(cat VERSION | tr -d '[:space:]' | sed 's/^v//')
        echo "Building version: $$VERSION"

        # Configure GAR auth if this is a dev build
        if [[ "${TAG_NAME}" =~ -dev$$ ]]; then
          if [[ -f /workspace/.gar_token ]]; then
            GAR_TOKEN=$$(cat /workspace/.gar_token)
            # Use the auth format that docker expects (base64 encoded username:password)
            AUTH_B64=$$(echo -n "oauth2accesstoken:$$GAR_TOKEN" | base64 -w0)
            mkdir -p /builder/home/.docker
            # Create config.json with the auth entry
            printf '{\n  "auths": {\n    "us-west1-docker.pkg.dev": {\n      "auth": "%s"\n    }\n  }\n}\n' "$$AUTH_B64" > /builder/home/.docker/config.json
            echo "GAR auth configured for us-west1-docker.pkg.dev"
          else
            echo "ERROR: /workspace/.gar_token not found for dev build"
            exit 1
          fi
        fi

        # Build with HF_TOKEN secret for model download
        echo "$$HF_TOKEN" > /tmp/hf_token
        DOCKER_BUILDKIT=1 docker build \
          --secret id=hf_token,src=/tmp/hf_token \
          -t build:${SHORT_SHA} \
          .
        rm /tmp/hf_token

        # Helper function to compare semver (returns 0 if $1 >= $2)
        version_gte() {
          [ "$$(printf '%s\n' "$$1" "$$2" | sort -V | tail -n1)" = "$$1" ]
        }

        # Tag and push based on trigger type
        if [[ "${TAG_NAME}" =~ ^v[0-9] ]] && [[ ! "${TAG_NAME}" =~ -dev$$ ]]; then
          # Version tag (v*): push to Docker Hub
          echo "Version tag build: ${TAG_NAME} -> Docker Hub"
          echo "$$DOCKERHUB_TOKEN" | docker login -u "$$DOCKERHUB_USERNAME" --password-stdin

          docker tag build:${SHORT_SHA} ${_DOCKERHUB_REPO}:$$VERSION
          docker push ${_DOCKERHUB_REPO}:$$VERSION

          # Only update 'latest' if this version >= current latest
          LATEST_DIGEST=$$(curl -s "https://hub.docker.com/v2/repositories/${_DOCKERHUB_REPO}/tags/latest" | \
            jq -r '.images[0].digest // empty' || echo "")

          CURRENT_VERSION="0.0.0"
          if [[ -n "$$LATEST_DIGEST" ]]; then
            CURRENT_VERSION=$$(curl -s "https://hub.docker.com/v2/repositories/${_DOCKERHUB_REPO}/tags?page_size=100" | \
              jq -r --arg digest "$$LATEST_DIGEST" \
              '.results[] | select(.images[].digest == $$digest) | .name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$$"))' | \
              head -1 || echo "0.0.0")
          fi
          CURRENT_VERSION="$${CURRENT_VERSION:-0.0.0}"

          echo "Current version: $$VERSION, Latest published: $$CURRENT_VERSION"
          if version_gte "$$VERSION" "$$CURRENT_VERSION"; then
            echo "Version $$VERSION >= $$CURRENT_VERSION, updating 'latest' tag"
            docker tag build:${SHORT_SHA} ${_DOCKERHUB_REPO}:latest
            docker push ${_DOCKERHUB_REPO}:latest
          else
            echo "Version $$VERSION < $$CURRENT_VERSION, skipping 'latest' tag update"
          fi

        elif [[ "${TAG_NAME}" =~ -dev$$ ]]; then
          # Dev tag (*-dev): push to GAR
          echo "Dev tag build: ${TAG_NAME} -> GAR"
          # Extract version from tag (remove v prefix if present)
          DEV_VERSION=$$(echo "${TAG_NAME}" | sed 's/^v//')
          echo "Pushing to GAR with tags: $$DEV_VERSION and ${SHORT_SHA}"

          docker tag build:${SHORT_SHA} ${_GAR_REPO}:$$DEV_VERSION
          docker tag build:${SHORT_SHA} ${_GAR_REPO}:${SHORT_SHA}
          docker push ${_GAR_REPO}:$$DEV_VERSION
          docker push ${_GAR_REPO}:${SHORT_SHA}

        else
          echo "Unknown tag pattern: ${TAG_NAME} - skipping push"
        fi

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 50
  logging: CLOUD_LOGGING_ONLY

timeout: '3600s'

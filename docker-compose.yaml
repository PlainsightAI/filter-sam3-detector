# Get Started pipeline: video_in -> sam3_detector -> webvis
# Start:
#   VIDEO_PATH=/absolute/path/to/video.mp4 docker compose -f docker-compose.yaml up -d
# Stop:
#   docker compose -f docker-compose.yaml down
# Outputs (host):
#   ./output/detections.jsonl
#   ./output/labels_coco.json
#   ./output/frames/
#   ./output/annotated_frames/
#
services:
  video_in:
    image: containers.openfilter.io/plainsightai/openfilter-video-in:v0.1.10
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: VideoIn
      FILTER_SOURCES: file:///video.mp4
      FILTER_OUTPUTS: tcp://*:5550
    volumes:
      - ${VIDEO_PATH:-./data/sample-video.mp4}:/video.mp4:ro
    networks:
      - filter-network

  sam3_detector:
    image: plainsightai/openfilter-sam3-detector:${SAM3_DETECTOR_VERSION:-latest}
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: SAM3Detector
      FILTER_SOURCES: tcp://video_in:5550
      FILTER_OUTPUTS: tcp://*:5551
      # SAM3 detection config
      FILTER_TEXT_PROMPT: ${FILTER_TEXT_PROMPT:-person}
      FILTER_TEXT_PROMPTS: ${FILTER_TEXT_PROMPTS:-}
      FILTER_DEVICE: ${FILTER_DEVICE:-cuda}
      FILTER_CONFIDENCE_THRESHOLD: ${FILTER_CONFIDENCE_THRESHOLD:-0.3}
      FILTER_OUTPUT_LABEL: sam3_detections
      FILTER_OUTPUT_PATH: ${FILTER_OUTPUT_PATH:-/output/detections.jsonl}
      FILTER_COCO_OUTPUT_PATH: ${FILTER_COCO_OUTPUT_PATH:-/output/labels_coco.json}
      FILTER_AUTO_EXPORT_COCO: ${FILTER_AUTO_EXPORT_COCO:-true}
      FILTER_FRAMES_OUTPUT_DIR: ${FILTER_FRAMES_OUTPUT_DIR:-/output/frames}
      FILTER_SAVE_ANNOTATED_FRAMES: ${FILTER_SAVE_ANNOTATED_FRAMES:-true}
      FILTER_ANNOTATED_FRAMES_OUTPUT_DIR: ${FILTER_ANNOTATED_FRAMES_OUTPUT_DIR:-/output/annotated_frames}
      FILTER_VISUALIZE: ${FILTER_VISUALIZE:-true}
      FILTER_ENABLE_TEMPORAL_INTERVALS: "false"
      # FILTER_VIZ_TOPIC: "viz"  # optional: separate topic for visualized frames; main stays original+meta
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./output:/output
    networks:
      - filter-network

  webvis:
    image: containers.openfilter.io/plainsightai/openfilter-webvis:v0.1.10
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: Webvis
      FILTER_SOURCES: tcp://sam3_detector:5551
    ports:
      - "8002:8000"
    networks:
      - filter-network

networks:
  filter-network:

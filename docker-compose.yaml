services:
  video_in:
    image: containers.openfilter.io/plainsightai/openfilter-video-in:v0.1.10
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: VideoIn
      FILTER_SOURCES: file:///video.mp4!loop!sync
      FILTER_OUTPUTS: tcp://*:5550
    volumes:
      - ./data/sample-video.mp4:/video.mp4:ro
    networks:
      - filter-network

  sam3_detector:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - hf_token
    image: filter-sam3-detector:local
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: SAM3Detector
      FILTER_SOURCES: tcp://video_in:5550
      FILTER_OUTPUTS: tcp://*:5551
      # SAM3 detection config
      FILTER_TEXT_PROMPT: ${FILTER_TEXT_PROMPT:-person}
      FILTER_CONFIDENCE_THRESHOLD: ${FILTER_CONFIDENCE_THRESHOLD:-0.3}
      FILTER_OUTPUT_LABEL: sam3_detections
      # Integrated temporal interval tracking (no separate filter needed)
      FILTER_ENABLE_TEMPORAL_INTERVALS: "true"
      FILTER_TEMPORAL_HALF_LIFE: ${FILTER_HALF_LIFE:-5.0}
      FILTER_TEMPORAL_PRESENCE_THRESHOLD: ${FILTER_PRESENCE_THRESHOLD:-0.4}
      FILTER_TEMPORAL_OUTPUT_JSON_PATH: /output/intervals.json
      FILTER_TEMPORAL_STREAMING_MODE: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./output:/output
    networks:
      - filter-network

  webvis:
    image: containers.openfilter.io/plainsightai/openfilter-webvis:v0.1.10
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: Webvis
      FILTER_SOURCES: tcp://sam3_detector:5551
    ports:
      - "8001:8000"
    networks:
      - filter-network

networks:
  filter-network:

# Build-time secrets for HuggingFace authentication.
# The HF_TOKEN is only needed during build to download the gated model.
# At runtime, model weights are already baked into the image.
#
# Usage options:
#   1. Set HF_TOKEN environment variable before building
#   2. Use: docker compose build --build-arg HF_TOKEN=your_token
#   3. Use docker build directly with a token file:
#      docker build --secret id=hf_token,src=$HOME/.cache/huggingface/token .
secrets:
  hf_token:
    environment: HF_TOKEN

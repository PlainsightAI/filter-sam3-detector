# Get Started pipeline: VideoIn -> SAM3Detector -> Webvis
# Start:
#   docker compose -f docker-compose.yaml up -d                      # uses ./data/car.mp4
#   VIDEO_PATH=/absolute/path/to/video.mp4 docker compose -f docker-compose.yaml up -d
# Stop:
#   docker compose -f docker-compose.yaml down
# Supports:
#   - Positive/negative reference images (FILTER_REF_IMAGES / FILTER_REF_IMAGES_NEGATIVE)
#   - Positive/negative reference boxes (FILTER_POSITIVE_BOXES / FILTER_NEGATIVE_BOXES)
#   - Optional text prompt (FILTER_TEXT_PROMPT)
# Outputs (host default):
#   ./results/detections.jsonl
#   ./results/labels_coco.json
#   ./results/frames/
#   ./results/annotated_frames/

services:
  video_in:
    image: containers.openfilter.io/plainsightai/openfilter-video-in:1.2.1
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: VideoIn
      FILTER_SOURCES: file:///video.mp4!sync
      FILTER_OUTPUTS: tcp://*:5550
    volumes:
      - ${VIDEO_PATH:-./data/car.mp4}:/video.mp4:ro
    networks:
      - filter-network

  sam3_detector:
    image: plainsightai/openfilter-sam3-detector:${SAM3_DETECTOR_VERSION:-0.1.29}
    platform: linux/amd64
    # Optional on purpose: .env is not tracked, so requiring it made a bare
    # `docker compose up` fail in a clean checkout, which is the exact flow the
    # README and QUICKSTART document. Every value it can carry already has a
    # default below or in the image, so the file is a convenience, not a
    # prerequisite. Needs Compose 2.24+.
    env_file:
      - path: .env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: filter_sam3_detector
      FILTER_SOURCES: tcp://video_in:5550
      FILTER_OUTPUTS: tcp://*:5552
      # Defaults to `car`, matching the bundled ./data/car.mp4, so a bare
      # `docker compose up -d` in a clean checkout actually produces detections.
      # An empty default sent the filter down the no-prompt branch: it warns and
      # emits nothing, which reads as a broken pipeline rather than a missing
      # setting.
      FILTER_TEXT_PROMPT: ${FILTER_TEXT_PROMPT:-car}
      # Plural form, split on `###`. Present here so it can be set inline on the
      # command line like every other variable in this file; without it the value
      # only ever arrived through .env and was silently dropped from the shell.
      FILTER_TEXT_PROMPTS: ${FILTER_TEXT_PROMPTS:-}
      FILTER_REF_IMAGES: ${FILTER_REF_IMAGES:-}
      FILTER_REF_IMAGES_NEGATIVE: ${FILTER_REF_IMAGES_NEGATIVE:-}
      FILTER_POSITIVE_BOXES: ${FILTER_POSITIVE_BOXES:-}
      FILTER_NEGATIVE_BOXES: ${FILTER_NEGATIVE_BOXES:-}
      FILTER_DEVICE: ${FILTER_DEVICE:-cuda}
      FILTER_CONFIDENCE_THRESHOLD: ${FILTER_CONFIDENCE_THRESHOLD:-0.5}
      FILTER_OUTPUT_LABEL: detections
      # FILTER_VIZ_TOPIC: "viz"  # optional: separate topic for visualized frames; main stays original+meta
      FILTER_OUTPUT_PATH: ${FILTER_OUTPUT_PATH:-/output/detections.jsonl}
      FILTER_COCO_OUTPUT_PATH: ${FILTER_COCO_OUTPUT_PATH:-/output/labels_coco.json}
      FILTER_AUTO_EXPORT_COCO: ${FILTER_AUTO_EXPORT_COCO:-true}
      FILTER_FRAMES_OUTPUT_DIR: ${FILTER_FRAMES_OUTPUT_DIR:-/output/frames}
      FILTER_SAVE_ANNOTATED_FRAMES: ${FILTER_SAVE_ANNOTATED_FRAMES:-true}
      FILTER_ANNOTATED_FRAMES_OUTPUT_DIR: ${FILTER_ANNOTATED_FRAMES_OUTPUT_DIR:-/output/annotated_frames}
      FILTER_VISUALIZE: ${FILTER_VISUALIZE:-true}
      FILTER_ENABLE_TEMPORAL_INTERVALS: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ${FILTER_OUTPUT_DIR:-./results}:/output
      - ./data:/data:ro
    networks:
      - filter-network

  webvis:
    image: containers.openfilter.io/plainsightai/openfilter-webvis:1.2.1
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: Webvis
      FILTER_SOURCES: tcp://sam3_detector:5552
    ports:
      - "8002:8000"
    networks:
      - filter-network

networks:
  filter-network:

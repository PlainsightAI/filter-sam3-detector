[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["filter_sam3_detector"]  # Specify the package directory

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[project]
name = "filter_sam3_detector"
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = "Apache-2.0 AND LicenseRef-SAM"
license-files = ["LICENSE", "LICENSING.md", "sam3/LICENSE"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dynamic = ["version"]

dependencies = [
  "openfilter[all]>=1.1.2,<2.0.0",
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "numpy>=1.24.0",
  "pillow>=10.0.0",
  "transformers>=4.40.0",
  "opencv-python>=4.8.0",
  "python-dotenv>=1.0.0",
  "tomli>=2.0.0; python_version < '3.11'",  # Required for Python < 3.11 (OpenFilter uses tomllib in 3.11+)
  "sam3",
  # SAM3 dependencies not in its pyproject.toml
  "einops",
  "decord; sys_platform != 'darwin' or platform_machine != 'arm64'",
  "eva-decord; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pycocotools",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "setuptools~=72.2.0",
  "twine>=6.1.0,<7",
  "wheel~=0.44.0",
  "pytest~=8.3.4",
  "pytest-cov~=6.0.0",
]

[project.scripts]
filter-sam3-detector = "filter_sam3_detector.filter:FilterSAM3Detector.run"

[tool.uv]
override-dependencies = ["numpy>=1.26.4,<3"]

[tool.uv.sources]
sam3 = { path = "sam3" }

[[tool.uv.index]]
name = "openfilter"
url = "https://python.openfilter.io/simple"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.distutils.bdist_wheel]
python-tag = "py3"


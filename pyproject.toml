[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["filter_sam3_detector"]  # Specify the package directory

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[project]
name = "filter_sam3_detector"
readme = "README.md"
requires-python = ">=3.10, <3.15"
license = "Apache-2.0 AND LicenseRef-SAM"
license-files = ["LICENSE", "LICENSING.md", "sam3/LICENSE"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dynamic = ["version"]

dependencies = [
  "openfilter[all]>=1.3.0,<2.0.0",
  "torch>=2.9,<2.10",
  "torchvision>=0.24,<0.25",
  "numpy>=1.24.0",
  "pillow>=10.0.0",
  "transformers>=5.0.0, <6.0.0",
  "kernels >= 0.15.2, < 0.16.0",
  "av~=17.1.0",
  "opencv-python>=4.8.0",
  "python-dotenv>=1.0.0",
  "tomli>=2.0.0; python_version < '3.11'",  # Required for Python < 3.11 (OpenFilter uses tomllib in 3.11+)
  "sam3",
  # SAM3 dependencies not in its pyproject.toml
  "einops",
  "pycocotools",
  "psutil~=7.2.2"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "setuptools~=72.2.0",
  "twine>=6.1.0,<7",
  "wheel~=0.44.0",
  "pytest~=8.3.4",
  "pytest-cov~=6.0.0",
  "ruff>=0.15.22"
]

[project.scripts]
filter-sam3-detector = "filter_sam3_detector.filter:FilterSAM3Detector.run"


[tool.uv]
# opentelemetry-resourcedetector-gcp: openfilter requires >=1.11.0a0,<1.12.dev0, a range
# that only pre-releases satisfy. uv allowed them while the package had no stable release;
# once 1.13.0 shipped (2026-07-22) that rule stopped applying and resolution broke. Pin the
# pre-release explicitly instead of enabling pre-releases for every package.
override-dependencies = ["numpy>=1.26.4,<3", "opentelemetry-resourcedetector-gcp==1.11.0a0"]

[tool.uv.sources]
sam3 = { path = "sam3" }

[[tool.uv.index]]
name = "openfilter"
url = "https://python.openfilter.io/simple"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.distutils.bdist_wheel]
python-tag = "py3"


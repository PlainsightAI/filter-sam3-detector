# SAM3 detector integration with Sweetgreen pipeline
# Substitutes ALL protege detector filters with a single SAM3 instance using multi-output mode
#
# Multi-output mode runs ONE model instance that processes multiple "prompt sets",
# each with its own prompts, confidence threshold, and output topic. This is memory-efficient
# (single GPU, single model load) while matching the production topology's multi-detector structure.
#
# Production topology (external-sweetgreen/scripts/docker-compose.prod.yaml):
#   video_in
#      ├── filter-bowl-detector ──────────┐
#      └── filter-chit-detector ──┐       │
#                                 ▼       ▼
#                            filter_crop
#                    ┌───────────┼───────────┐
#                    ▼           ▼           ▼
#          filter_sweetgreen_ocr  filter_protege_bowl  filter_protege_dressing_cups
#                    │           │           │
#                    └───────────┼───────────┘
#                                ▼
#                    filter_sweet_green_subject_data_aggregator
#
# SAM3 multi-output mode (this file):
#   video_in
#      │
#      └── sam3_detector (single instance, multi-output)
#                │
#                ├── main (bowl detection)
#                ├── chit (chit detection)
#                ├── bowl (ingredient classification)
#                └── dressing_cups (dressing detection)
#                │
#                ▼
#      filter_sweet_green_subject_data_aggregator
#
# Usage:
#   1. Build local image:
#      HF_TOKEN=$(gcloud secrets versions access latest --secret=sam3-hf-token --project=plainsightai-dev) \
#        docker build --secret id=hf_token,env=HF_TOKEN -t filter-sam3-detector:local .
#
#   2. Place test video (see SWEETGREEN.md for instructions):
#      data/sample-video.mp4
#
#   3. Run pipeline:
#      SAM3_IMAGE=filter-sam3-detector:local docker compose -f sweetgreen.yaml up --abort-on-container-exit
#
#   4. View results:
#      - Browser: http://localhost:8020 (aggregator visualization)
#      - JSONL:   cat output/detections.jsonl
#
# For production with event sink (use --profile event-sink):
#   FILTER_API_ENDPOINT=... FILTER_API_TOKEN=... \
#     docker compose -f sweetgreen.yaml --profile event-sink up

services:
  video_in:
    image: us-west1-docker.pkg.dev/plainsightai-prod/oci/video_in:v1.4.25
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: VideoIn
      FILTER_SOURCES: ${VIDEO_INPUT:-file:///video.mp4!sync!loop=false}
      FILTER_FPS: ${FILTER_FPS:-5}
      FILTER_OUTPUTS: "tcp://*:5550"
      FILTER_OUTPUTS_FILTER: "true"
    volumes:
      - ./data/sample-video.mp4:/video.mp4:ro
    networks:
      - filter-network

  # Single SAM3 instance with multi-output mode
  # Replaces 4 production detectors with one model, outputting to 4 topics:
  #   main (bowl) -> aggregator main input
  #   chit -> aggregator chit input
  #   bowl (ingredients) -> aggregator bowl input
  #   dressing_cups -> aggregator dressing_cups input
  sam3_detector:
    image: ${SAM3_IMAGE:-us-west1-docker.pkg.dev/plainsightai-dev/oci/filter-sam3-detector:0.2.0-dev}
    platform: linux/amd64
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: sam3_detector
      FILTER_SOURCES: tcp://video_in:5550;*
      FILTER_OUTPUTS: tcp://*:5551
      FILTER_OUTPUTS_FILTER: "true"
      FILTER_VISUALIZE: "false"
      FILTER_OUTPUT_BOXES: "true"
      # Write detections for debugging
      FILTER_OUTPUT_PATH: /output/detections.jsonl
      # Multi-output mode: each prompt set becomes a virtual detector
      # The model runs inference ONCE per frame, then processes each prompt set
      FILTER_PROMPT_SETS: |
        [
          {
            "name": "bowl_detector",
            "prompts": ["bowl"],
            "topic": "main",
            "confidence_threshold": 0.5,
            "max_detections": 1,
            "filter_name": "SAM3BowlDetector"
          },
          {
            "name": "chit_detector",
            "prompts": ["chit"],
            "topic": "chit",
            "confidence_threshold": 0.5,
            "max_detections": 1,
            "filter_name": "SAM3ChitDetector"
          },
          {
            "name": "ingredient_classifier",
            "prompts": ["avocado", "chicken", "blackened_chicken", "steak", "egg", "tofu", "portobello"],
            "topic": "bowl",
            "confidence_threshold": 0.25,
            "max_detections": 100,
            "filter_name": "SAM3IngredientClassifier"
          },
          {
            "name": "dressing_detector",
            "prompts": ["dressing_cup"],
            "topic": "dressing_cups",
            "confidence_threshold": 0.5,
            "max_detections": 5,
            "filter_name": "SAM3DressingDetector"
          }
        ]
    volumes:
      - ./output:/output
    networks:
      - filter-network

  # Real sweetgreen aggregator - NOT substituted
  # Receives from SAM3's multi-output topics
  filter_sweet_green_subject_data_aggregator:
    image: us-west1-docker.pkg.dev/plainsightai-prod/oci/filter-sweet-green-subject-data-aggregator:v0.1.11
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: filter_sweet_green_subject_data_aggregator
      FILTER_DEBUG: "true"

      # Production sources (for reference):
      #   '["tcp://filter-bowl-detector:5620;main",
      #     "tcp://filter_sweetgreen_ocr:6000;chit",
      #     "tcp://filter_protege_bowl:6002;bowl",
      #     "tcp://filter_protege_dressing_cups:6008;bowl>dressing_cups"]'
      #
      # SAM3 multi-output sources - single detector outputs to multiple topics:
      FILTER_SOURCES: '["tcp://sam3_detector:5551;main","tcp://sam3_detector:5551;chit","tcp://sam3_detector:5551;bowl","tcp://sam3_detector:5551;dressing_cups"]'
      FILTER_REQUIRE_ALL: "false"
      FILTER_OUTPUTS: "tcp://*:6004"
      FILTER_OUTPUT_TOPIC: aggregated

      FILTER_TOPICS: '["chit","bowl","dressing_cups"]'
      FILTER_FORWARD_UPSTREAM_DATA: "true"

      FILTER_DRAW_LABELS: "true"
      FILTER_DRAW_DETECTIONS: "true"
      FILTER_DRAW_BBOX_THICKNESS: "2"
      FILTER_DRAW_BBOX_ALPHA: "0.25"
      FILTER_DRAW_BOWL_BBOX_COLOR_BGR: "[66,66,255]"
      FILTER_DRAW_CHIT_BBOX_COLOR_BGR: "[255,128,0]"

      FILTER_DRAW_DRESSING_COUNT: "true"
      FILTER_DRAW_DRESSING_PREFIX: "DRESSING CUPS"

      FILTER_INGREDIENTS: '["avocado","blackened_chicken","roasted_chicken","caramelized_garlic_steak","hard_boiled_egg","roasted_tofu","warm_portobello_mix"]'

      # Thresholds for SAM3 integration
      FILTER_THRESHOLDS__caramelized_garlic_steak: "0.25"
      FILTER_THRESHOLDS__roasted_chicken: "0.25"
      FILTER_THRESHOLDS__blackened_chicken: "0.25"
      FILTER_THRESHOLDS__avocado: "0.20"
      FILTER_THRESHOLDS__hard_boiled_egg: "0.25"
      FILTER_THRESHOLDS__roasted_tofu: "0.25"
      FILTER_THRESHOLDS__warm_portobello_mix: "0.25"

      FILTER_DISPLAY_NAMES__avocado: "Avocado"
      FILTER_DISPLAY_NAMES__blackened_chicken: "Blackened Chicken"
      FILTER_DISPLAY_NAMES__roasted_chicken: "Roasted Chicken"
      FILTER_DISPLAY_NAMES__caramelized_garlic_steak: "Caramelized Garlic Steak"
      FILTER_DISPLAY_NAMES__hard_boiled_egg: "Hard Boiled Egg"
      FILTER_DISPLAY_NAMES__roasted_tofu: "Roasted Tofu"
      FILTER_DISPLAY_NAMES__warm_portobello_mix: "Warm Portobello Mix"

      # Global aliases: SAM3 class names -> aggregator canonical names
      FILTER_ALIASES__avocado: "avocado"
      FILTER_ALIASES__chicken: "roasted_chicken"
      FILTER_ALIASES__blackened_chicken: "blackened_chicken"
      FILTER_ALIASES__steak: "caramelized_garlic_steak"
      FILTER_ALIASES__egg: "hard_boiled_egg"
      FILTER_ALIASES__tofu: "roasted_tofu"
      FILTER_ALIASES__portobello: "warm_portobello_mix"
      FILTER_ALIASES__dressing_cup: "dressing_cup"

      # Per-topic aliases (bowl topic)
      FILTER_ALIASES_BOWL__avocado: "avocado"
      FILTER_ALIASES_BOWL__chicken: "roasted_chicken"
      FILTER_ALIASES_BOWL__blackened_chicken: "blackened_chicken"
      FILTER_ALIASES_BOWL__steak: "caramelized_garlic_steak"
      FILTER_ALIASES_BOWL__egg: "hard_boiled_egg"
      FILTER_ALIASES_BOWL__tofu: "roasted_tofu"
      FILTER_ALIASES_BOWL__portobello: "warm_portobello_mix"

      # Per-topic aliases (chit topic) - for SAM3 chit detection
      FILTER_ALIASES_CHIT__chit: "chit"

      FILTER_CLASSIFIER_ALIASES__bowl: "sam3_classifier_metadata"
      FILTER_CLASSIFIER_ALIASES__chit: "sam3_chit_classifier_metadata"
      FILTER_CLASSIFIER_VERSIONS__bowl: "sam3-integration-test"
      FILTER_CLASSIFIER_VERSIONS__chit: "sam3-integration-test"

      FILTER_STABILIZATION_MODES__bowl: "mode"
      FILTER_STABILIZATION_MODES__chit: "mode"
      FILTER_MODE_MIN_OBS: "5"
      FILTER_ANALYSIS_LOGGING_ENABLED: "false"

      FILTER_MQ_LOG: metrics
    networks:
      - filter-network

  webvis:
    image: us-west1-docker.pkg.dev/plainsightai-prod/oci/webvis:v1.4.25
    environment:
      FILTER_ID: webvis
      FILTER_SOURCES: tcp://filter_sweet_green_subject_data_aggregator:6004;aggregated>main
    ports:
      - ${PIPELINE_PORT:-8020}:8000
    networks:
      - filter-network

  # Event sink for production - posts detections to CloudEvents API
  # Activated with: --profile event-sink
  filter_event_sink:
    profiles:
      - event-sink
    image: containers.openfilter.io/plainsightai/openfilter-event-sink:1.0.3
    platform: linux/amd64
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: SAM3EventSink
      FILTER_SOURCES: tcp://filter_sweet_green_subject_data_aggregator:6004;*
      FILTER_MQ_LOG: ${FILTER_MQ_LOG:-pretty}
      FILTER_API_ENDPOINT: ${FILTER_API_ENDPOINT:-}
      FILTER_API_TOKEN: ${FILTER_API_TOKEN:-}
      FILTER_API_CUSTOM_HEADERS: ${FILTER_API_CUSTOM_HEADERS:-}
      FILTER_EVENT_TOPICS: ${FILTER_EVENT_TOPICS:-*}
      FILTER_FLUSH_INTERVAL_SECONDS: ${FILTER_FLUSH_INTERVAL_SECONDS:-5.0}
      FILTER_MAX_BATCH_EVENTS: ${FILTER_MAX_BATCH_EVENTS:-5000}
    networks:
      - filter-network

networks:
  filter-network:
